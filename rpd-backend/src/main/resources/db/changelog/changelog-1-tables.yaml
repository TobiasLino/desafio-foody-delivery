databaseChangeLog:
  - changeSet:
      id: 1
      author: Tobias
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: rpd_user
      changes:
        - createTable:
            tableName: rpd_user
            columns:
              - column:
                  name: id
                  type: BIGINT
              - column:
                  name: name
                  type: VARCHAR(250)
              - column:
                  name: email
                  type: VARCHAR(250)
              - column:
                  name: password
                  type: VARCHAR(250)
  - changeSet:
      id: 2
      author: Tobias
      preConditions:
          - onFail: MARK_RAN
            not:
              tableExists:
                tableName: rpd_order
      changes:
        - createTable:
            tableName: rpd_order
            columns:
              - column:
                  name: id
                  type: BIGINT
              - column:
                  name: id_address
                  type: BIGINT
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: id_client
                  type: BIGINT
  - changeSet:
      id: 3
      author: Tobias
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: rpd_item
      changes:
        - createTable:
            tableName: rpd_item
            columns:
              - column:
                  name: id
                  type: BIGINT
              - column:
                  name: description
                  type: VARCHAR(250)
  - changeSet:
      id: 4
      author: Tobias
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: rpd_address
      changes:
        - createTable:
            tableName: rpd_address
            columns:
              - column:
                  name: id
                  type: BIGINT
              - column:
                  name: cep
                  type: VARCHAR(8)
              - column:
                  name: street
                  type: VARCHAR(250)
              - column:
                  name: neighborhood
                  type: VARCHAR(250)
              - column:
                  name: complement
                  type: VARCHAR(250)
              - column:
                  name: number
                  type: VARCHAR(10)
              - column:
                  name: city
                  type: VARCHAR(250)
              - column:
                  name: uf
                  type: VARCHAR(250)
  - changeSet:
      id: 5
      author: Tobias
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: rpd_order_item
      changes:
        - createTable:
            tableName: rpd_order_item
            columns:
              - column:
                  name: id_order
                  type: BIGINT
              - column:
                  name: id_item
                  type: BIGINT
  - changeSet:
      id: 6
      author: Tobias
      changes:
        - addAutoIncrement:
            tableName: rpd_user
            columnName: id
            columnDatatype: BIGINT
            incrementBy: 1
            startWith: 100
        - addPrimaryKey:
            tableName: rpd_user
            columnNames: id
            constraintName: pk_rpd_user
        - addAutoIncrement:
            tableName: rpd_order
            columnName: id
            columnDatatype: BIGINT
            incrementBy: 1
            startWith: 100
        - addPrimaryKey:
            tableName: rpd_order
            columnNames: id
            constraintName: pk_rpd_order

        - addNotNullConstraint:
            constraint_name: nn_rpd_order_item_order
            tableName: rpd_order_item
            columnName: id_order
        - addNotNullConstraint:
            constraint_name: nn_rpd_order_item_item
            tableName: rpd_order_item
            columnName: id_item
        - addPrimaryKey:
            tableName: rpd_order_item
            columnNames: id_order, id_item
            constraintName: pk_rpd_order_item

        - addAutoIncrement:
            tableName: rpd_address
            columnName: id
            columnDatatype: BIGINT
            incrementBy: 1
            startWith: 100
        - addPrimaryKey:
            tableName: rpd_address
            columnNames: id
            constraintName: pk_rpd_address
        - addAutoIncrement:
            tableName: rpd_item
            columnName: id
            columnDatatype: BIGINT
            incrementBy: 1
            startWith: 100
        - addPrimaryKey:
            tableName: rpd_item
            columnNames: id
            constraintName: pk_rpd_item
        - addForeignKeyConstraint:
            constraintName: fk_rpd_order_client
            baseTableName: rpd_order
            baseColumnNames: id_client
            referencedTableName: rpd_user
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_rpd_order_address
            baseTableName: rpd_order
            baseColumnNames: id_address
            referencedTableName: rpd_address
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_rpd_order_item_order
            baseTableName: rpd_order_item
            baseColumnNames: id_order
            referencedTableName: rpd_order
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_rpd_order_item_item
            baseTableName: rpd_order_item
            baseColumnNames: id_item
            referencedTableName: rpd_item
            referencedColumnNames: id
  - changeSet:
      id: 7
      author: Tobias
      changes:
        - addUniqueConstraint:
            constraintName: uk_rpd_user_email
            tableName: rpd_user
            columnNames: email
        - addNotNullConstraint:
            constraint_name: nn_rpd_user_name
            tableName: rpd_user
            columnName: name
        - addNotNullConstraint:
            constraint_name: nn_rpd_user_email
            tableName: rpd_user
            columnName: email
        - addNotNullConstraint:
            constraint_name: nn_rpd_user_password
            tableName: rpd_user
            columnName: password
        - addNotNullConstraint:
            constraint_name: nn_rpd_order_address
            tableName: rpd_order
            columnName: id_address
        - addNotNullConstraint:
            constraint_name: nn_rpd_order_status
            tableName: rpd_order
            columnName: status
        - addNotNullConstraint:
            constraint_name: nn_rpd_order_client
            tableName: rpd_order
            columnName: id_client
        - addNotNullConstraint:
            constraint_name: nn_rpd_item_description
            tableName: rpd_item
            columnName: description
        - addNotNullConstraint:
            constraint_name: nn_rpd_address_cep
            tableName: rpd_address
            columnName: cep
        - addNotNullConstraint:
            constraint_name: nn_rpd_address_street
            tableName: rpd_address
            columnName: street
        - addNotNullConstraint:
            constraint_name: nn_rpd_address_neighborhood
            tableName: rpd_address
            columnName: neighborhood
        - addNotNullConstraint:
            constraint_name: nn_rpd_address_number
            tableName: rpd_address
            columnName: number
        - addNotNullConstraint:
            constraint_name: nn_rpd_address_city
            tableName: rpd_address
            columnName: city
        - addNotNullConstraint:
            constraint_name: nn_rpd_address_uf
            tableName: rpd_address
            columnName: uf
  - changeSet:
      id: 8
      author: Tobias
      changes:
        - addColumn:
            tableName: rpd_user
            columns:
              - column:
                  name: role
                  type: VARCHAR(20)
                  defaultValue: CLIENT
                  constraints:
                    nullable: false