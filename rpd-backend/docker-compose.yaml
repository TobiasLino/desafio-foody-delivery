services:
  postgres:
    image: 'postgres:latest'
    container_name: postgres
    environment:
      - 'POSTGRES_DB=rpd'
      - 'POSTGRES_PASSWORD=rpd'
      - 'POSTGRES_USER=rpd'
    ports:
      - '5432:5432'
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U rpd -d rpd' ]
      interval: 5s
      timeout: 3s
      retries: 10
  rpd:
    image: 'rpd-foody-delivery:latest'
    build:
      context: .
    container_name: rpd
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
  tests:
    build:
      context: .
      target: test
    profiles: ['test']
