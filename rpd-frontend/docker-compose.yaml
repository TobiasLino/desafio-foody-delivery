# Frontend Docker Compose
services:
  rpd-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      rpd-backend:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - API_URL=http://localhost:8080
    command: npm run dev -- --host 0.0.0.0